[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudbill-detective"
version = "0.1.0"
description = "Read-only Python MCP server that explains why an AWS bill grew"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "boto3>=1.35.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
cloudbill-detective = "cloudbill_detective.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cloudbill_detective*"]

[tool.setuptools.package-data]
cloudbill_detective = ["static/*.html"]

